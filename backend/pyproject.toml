[project]
name = "raumbuchung-api"
version = "0.1.0"
description = "Raumbuchung API — FastAPI backend for room and booking management on PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.144",
    "uvicorn[standard]>=0.30,<0.55",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
